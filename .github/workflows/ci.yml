name: CI

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    name: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: License check
        run: npx license-checker --production --summary

  dist-readiness:
    name: dist-readiness
    runs-on: ubuntu-latest
    # The golden suite (tests/golden/golden.test.ts, TEST-01) is the
    # release-gating test job — this job only runs once build-and-verify's
    # `pnpm run test` step is green (ROADMAP Phase 8 criterion 1).
    needs: build-and-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack (dry-run — no publish)
        run: pnpm pack

      - name: List tarball contents
        run: tar -tzf immunogen-*.tgz
