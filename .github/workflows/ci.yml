name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Dist smoke tests (built package, installed CLI, skill parity)
        run: pnpm run test:dist

      - name: License check
        run: npx license-checker --production --summary

  dist-readiness:
    name: dist-readiness
    runs-on: ubuntu-latest
    # The golden suite (tests/golden/golden.test.ts, TEST-01) is the
    # release-gating test job — this job only runs once build-and-verify's
    # `pnpm run test` step is green (ROADMAP Phase 8 criterion 1).
    needs: build-and-verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack (dry-run — no publish)
        run: pnpm pack

      - name: List tarball contents
        run: tar -tzf immunogen-*.tgz

  action:
    name: action (dogfood)
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clean fixture passes
        id: clean
        uses: ./
        with:
          path: tests/fixtures/scan/clean
          upload-sarif: "false"

      - name: Vulnerable fixture is blocked
        id: vulnerable
        uses: ./
        with:
          path: tests/fixtures/vulnerable-apps/nextjs-kitchen-sink
          format: json
          output: vulnerable.json
          upload-sarif: "false"
          fail-on-blocked: "false"

      - name: Check the action's outputs
        env:
          CLEAN: ${{ steps.clean.outputs.verdict }}/${{ steps.clean.outputs.grade }}
          VULNERABLE: ${{ steps.vulnerable.outputs.verdict }}/${{ steps.vulnerable.outputs.grade }}
        run: |
          echo "clean=$CLEAN vulnerable=$VULNERABLE"
          test "$CLEAN" = "pass/A"
          test "$VULNERABLE" = "blocked/F"

      - name: immunogen scans itself
        uses: ./
        with:
          path: .
          format: terminal
          output: self-scan.txt
          upload-sarif: "false"

      - name: Show the self-scan
        if: always()
        run: cat self-scan.txt || true
