name: Release

# Cuts a GitHub Release (with the installable npm tarball attached) whenever
# main carries a package.json version that has not been released yet:
#
#   1. bump "version" in package.json and add a CHANGELOG.md entry
#   2. merge to main — this workflow creates the v<version> tag and release
#
# Pushing a v<version> tag by hand, or running the workflow manually, does the
# same. The tarball is attached twice: as immunogen-<version>.tgz and as
# immunogen.tgz, so .../releases/latest/download/immunogen.tgz always installs
# the newest release. If an npm automation token is stored as the NPM_TOKEN
# repository secret, the same tarball is also published to npm.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Is this version unreleased?
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "v${version} is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm provenance attestation
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Dist smoke tests
        run: pnpm run test:dist

      - name: Pack
        run: |
          pnpm pack
          cp "immunogen-${VERSION}.tgz" immunogen.tgz

      - name: Create GitHub Release
        run: |
          # Release notes = this version's CHANGELOG.md section (falls back to generated notes).
          awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "v${VERSION}" "immunogen-${VERSION}.tgz" immunogen.tgz \
            --target "${GITHUB_SHA}" --title "v${VERSION}" "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish "immunogen-${VERSION}.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
