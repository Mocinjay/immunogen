name: Release

# Cuts a GitHub Release (with the installable npm tarball attached) whenever
# main carries a package.json version that has not been released yet:
#
#   1. bump "version" in package.json and add a CHANGELOG.md entry
#   2. merge to main — this workflow creates the v<version> tag and release
#
# Pushing a v<version> tag by hand, or running the workflow manually, does the
# same. The tarball is attached twice: as immunogen-<version>.tgz and as
# immunogen.tgz, so .../releases/latest/download/immunogen.tgz always installs
# the newest release. The same tarball is then published to npm through npm
# trusted publishing (OIDC): no npm token is stored anywhere, and npm attaches
# a provenance attestation linking the package to this workflow run (set up
# once with `npm trust github immunogen --file release.yml --repo
# Mocinjay/immunogen`).
#
# The two halves are checked separately: a version already released on GitHub
# but missing from npm is rebuilt, checked file-for-file against the release
# tarball, and published — so a failed or skipped npm publish is recovered by
# running this workflow again.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this version unreleased?
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "v${version} is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          # Only a clear 404 means "not on npm"; any other failure stops the run rather than guessing.
          if npm_out="$(npm view "immunogen@${version}" version 2>&1)"; then
            echo "immunogen@${version} is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${npm_out}" | grep -q 'E404'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${npm_out}" >&2
            echo "::error::Could not ask npm whether immunogen@${version} exists."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: release
    needs: check
    if: needs.check.outputs.release == 'true' || needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Dist smoke tests
        run: pnpm run test:dist

      - name: Pack
        run: |
          pnpm pack
          cp "immunogen-${VERSION}.tgz" immunogen.tgz

      - name: Create GitHub Release
        if: needs.check.outputs.release == 'true'
        run: |
          # Release notes = this version's CHANGELOG.md section (falls back to generated notes).
          awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "v${VERSION}" "immunogen-${VERSION}.tgz" immunogen.tgz \
            --target "${GITHUB_SHA}" --title "v${VERSION}" "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Match the existing GitHub Release
        if: needs.check.outputs.release != 'true'
        run: |
          # The release was cut earlier: what goes to npm must contain exactly the released files.
          mkdir -p released/tgz released/files built
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "immunogen-${VERSION}.tgz" --dir released/tgz
          tar -xzf "released/tgz/immunogen-${VERSION}.tgz" -C released/files
          tar -xzf "immunogen-${VERSION}.tgz" -C built
          if ! diff -r released/files built; then
            echo "::error::This build of v${VERSION} differs from the GitHub Release tarball — not publishing it to npm."
            exit 1
          fi
          echo "Rebuilt package matches the v${VERSION} GitHub Release file for file."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm (trusted publishing)
        if: needs.check.outputs.publish == 'true'
        run: |
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
          npm install -g npm@11.11.0 --silent
          npm publish "immunogen-${VERSION}.tgz" --access public
